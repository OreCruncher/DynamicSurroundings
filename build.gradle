// RetroFuturaGradle sets up 1.12.2 (Forge 14.23.5) itself; Gradle runs on any JDK 17+, and the mod is compiled and
// run with a Java 8 toolchain (an installed one, or one Gradle downloads).

import com.gtnewhorizons.retrofuturagradle.mcp.InjectTagsTask
import com.gtnewhorizons.retrofuturagradle.minecraft.RunMinecraftTask

plugins {
    id 'java'
    id 'java-library'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

apply from: 'gradle/scripts/helpers.gradle'

version = propertyString('mod_version')
group = propertyString('mod_group')

base {
    archivesName.set("${propertyString('archives_name')}-forge-${propertyString('minecraft_version')}")
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mcVersion.set(propertyString('minecraft_version'))
    mcpMappingChannel.set(propertyString('mapping_channel'))
    mcpMappingVersion.set(propertyString('mapping_version'))
    useDependencyAccessTransformers.set(true)
    username.set(propertyString('minecraft_username'))

    extraRunJvmArguments.addAll(
            '-ea:' + propertyString('mod_group'),
            '-Dmixin.checks.interfaces=true',
            '-Dmixin.debug.export=true')

    // Generates org.orecruncher.dsurround.Tags at build time (ModInfo.VERSION reads it)
    injectedTags.set([
            VERSION : propertyString('mod_version'),
            MOD_ID  : propertyString('mod_id'),
            MOD_NAME: propertyString('mod_name')
    ])
}

tasks.named('injectTags', InjectTagsTask).configure {
    outputClassName.set("${propertyString('mod_group')}.Tags")
}

repositories {
    maven {
        name = 'CleanroomMC Maven'
        url = 'https://maven.cleanroommc.com'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CleanroomMC CurseMaven'
                url = 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    maven {
        // JEI, Animania
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    mavenCentral()
}

// The OreLib jar to build and run against when it doesn't come from CurseForge (see dependencies), or null
File localOrelibJar() {
    def given = project.findProperty('orelib_jar')
    if (given)
        return file(given)
    if (propertyString('orelib_file'))
        return null
    def sibling = file("../OreLib/build/libs/orelib-forge-${propertyString('minecraft_version')}-${propertyString('orelib_version')}.jar")
    if (!sibling.exists())
        throw new GradleException("OreLib ${propertyString('orelib_version')} isn't on CurseForge yet: build it in ../OreLib " +
                "(./gradlew build), pass -Porelib_jar=<jar>, or set orelib_file once it is released")
    return sibling
}

// runClient puts the OreLib jar on the class path, but runObfClient only loads its mods folder
def copyOrelibToObfMods = tasks.register('copyOrelibToObfMods', Copy) {
    onlyIf { localOrelibJar() != null }
    from { localOrelibJar() }
    into file('run/obfuscated/mods')
}
tasks.matching { it.name == 'runObfClient' }.configureEach { dependsOn copyOrelibToObfMods }

dependencies {
    // Dev runs only: lets mods that ask for a newer Forge than RFG's 14.23.5.2847 load, as Forge's own
    // requirement checks would otherwise stop them
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'

    // Mixin comes from MixinBooter at runtime (players install it); the annotation processor writes the refmap
    String mixin = modUtils.enableMixins("zone.rong:mixinbooter:${propertyString('mixin_booter_version')}",
            propertyString('mixin_refmap'))
    implementation(mixin) {
        transitive = false
    }
    annotationProcessor mixin

    // Required. From CurseForge once orelib_file names a file of orelib_version there; until then the jar built in
    // an OreLib checkout beside this one. -Porelib_jar=<path to an OreLib release jar> picks another.
    if (localOrelibJar() != null) {
        implementation rfg.deobf(files(localOrelibJar()))
    } else {
        implementation rfg.deobf("curse.maven:orelib-307806:${propertyString('orelib_file')}")
    }

    // Optional integrations, compiled against only
    compileOnly rfg.deobf("mezz.jei:jei_1.12.2:${propertyString('jei_version')}")
    compileOnly rfg.deobf("curse.maven:craftstudio-api-268704:${propertyString('craftstudioapi_file')}")
    compileOnly rfg.deobf("com.animania:animania-1.12.2-base:${propertyString('animania_base_version')}")
    compileOnly rfg.deobf("com.animania:animania-1.12.2-farm:${propertyString('animania_farm_version')}")
    compileOnly rfg.deobf("com.animania:animania-1.12.2-extra:${propertyString('animania_extra_version')}")
    compileOnly rfg.deobf("curse.maven:cosmetic-armor-reworked-237307:${propertyString('cosmeticarmor_file')}")
    compileOnly rfg.deobf("curse.maven:iron-chests-228756:${propertyString('ironchest_file')}")
    compileOnly rfg.deobf("curse.maven:the-one-probe-245211:${propertyString('theoneprobe_file')}")
    compileOnly rfg.deobf("curse.maven:biomes-o-plenty-220318:${propertyString('biomesoplenty_file')}")
    compileOnly rfg.deobf("curse.maven:creativecore-257814:${propertyString('creativecore_file')}")
    compileOnly rfg.deobf("curse.maven:littletiles-257818:${propertyString('littletiles_file')}")
    compileOnly rfg.deobf("curse.maven:serene-seasons-291874:${propertyString('sereneseasons_file')}")
    compileOnly rfg.deobf("curse.maven:ctm-267602:${propertyString('ctm_file')}")

    // -PbiomeMods: dev runs load biome mods too, for surveying biome classification (/dsdump biomes): Biomes O' Plenty,
    // and with -PbiomeMods=<folder> every mod jar in that folder (release jars, deobfuscated for the dev run)
    if (project.hasProperty('biomeMods')) {
        runtimeOnly rfg.deobf("curse.maven:biomes-o-plenty-220318:${propertyString('biomesoplenty_file')}")
        def folder = project.findProperty('biomeMods')
        if (folder && folder != 'true') {
            def dir = file(folder)
            if (!dir.isDirectory())
                throw new GradleException("-PbiomeMods=${folder}: not a folder")
            dir.listFiles().findAll { it.name.endsWith('.jar') }.sort { it.name }.each { jar ->
                runtimeOnly rfg.deobf(files(jar))
            }
        }
    }

    // Plain unit tests (src/test), no game running
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    def props = [
            mod_id         : propertyString('mod_id'),
            mod_name       : propertyString('mod_name'),
            version        : propertyString('mod_version'),
            mcversion      : propertyString('minecraft_version'),
            mod_description: propertyString('mod_description'),
            mod_author     : propertyString('mod_author'),
            update_url     : propertyString('update_url')
    ]
    inputs.properties(props)
    filesMatching('mcmod.info') { it.expand(props) }
}

// The development bench (org.orecruncher.dsurround.bench: scenario runs, /dsbench; scripts/bench/README.md). With
// runClientBench, runClient runs in a folder of its own, run-bench (config, options, worlds), so the dev settings and
// worlds are never touched, and with -Pscenario=<file> runs that scenario and closes the game
def benchRun = gradle.startParameter.taskNames.any { it.contains('runClientBench') }
tasks.named('runClient', RunMinecraftTask).configure {
    def runName = benchRun ? 'runClientBench' : 'runClient'
    // System properties, not extraJvmArgs: adding to that list dropped RFG's own arguments, the natives' path among
    // them, and the game ran without sound (OpenAL not found). Named in a profile's environment (devRun)
    systemProperty 'dsurround.devRun', runName
    if (benchRun) {
        def folder = file('run-bench')
        workingDir = folder
        def scenario = project.findProperty('scenario')
        if (scenario)
            systemProperty 'dsurround.scenario', file(scenario).absolutePath
        doFirst { folder.mkdirs() }
    }
}
tasks.register('runClientBench') {
    group = 'Modded Minecraft'
    description = 'Runs a bench scenario (-Pscenario=<file>) in run-bench, or a plain client there without one'
    dependsOn 'runClient'
}

// The development bench is never published. Dev runs load the jar task's output (the -dev jar) too, so it is only
// left out when no run is asked for; checkReleaseJar fails a build whose release jar has it
def anyRun = gradle.startParameter.taskNames.any { it.toLowerCase().contains('run') }
jar {
    if (!anyRun)
        exclude 'org/orecruncher/dsurround/bench/**'

    // CREDITS.md and LICENSE.md go in the jar, as the MIT license asks
    from('CREDITS.md')
    from('LICENSE.md')

    // MixinBooter (11.0+) reads the mixin config straight from the jar's manifest
    manifest {
        attributes('MixinConfigs': propertyString('mixin_config'))
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                "1. Run Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = ['runClient']
                }
                "2. Run Server"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = ['runServer']
                }
                "3. Run Obfuscated Client"(org.jetbrains.gradle.ext.Gradle) {
                    taskNames = ['runObfClient']
                }
            }
            taskTriggers {
                afterSync 'injectTags'
            }
        }
    }
}

def checkReleaseJar = tasks.register('checkReleaseJar') {
    description = 'Fails if the development bench is in the release jar'
    dependsOn 'reobfJar'
    def released = layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}.jar")
    inputs.file(released)
    doLast {
        def zip = new java.util.zip.ZipFile(released.get().asFile)
        try {
            def bench = zip.entries().find { it.name.startsWith('org/orecruncher/dsurround/bench/') }
            if (bench)
                throw new GradleException("The release jar has the development bench in it (${bench.name}): build it without a run task")
        } finally {
            zip.close()
        }
    }
}
tasks.named('build').configure { dependsOn checkReleaseJar }
tasks.named('assemble').configure { finalizedBy checkReleaseJar }
