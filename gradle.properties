org.gradle.jvmargs = -Xmx3G

# Mod
mod_version = 4.0.0
mod_id = dsurround
mod_name = Dynamic Surroundings
mod_group = org.orecruncher.dsurround
mod_author = OreCruncher
mod_description = Adds a variety of sound and visual effects to improve your Minecraft experience
update_url = https://raw.githubusercontent.com/OreCruncher/DynamicSurroundings/master/version.json
# Jar: <archives_name>-forge-<minecraft_version>-<mod_version>.jar, as the 26.x line names its jars
archives_name = dynamicsurroundings
minecraft_version = 1.12.2

# MCP mappings the code is written against
mapping_channel = snapshot
mapping_version = 20171003

# Mixin, provided at runtime by MixinBooter (a required dependency, not bundled in the jar)
mixin_booter_version = 11.18
mixin_config = mixins.dsurround.json
mixin_refmap = mixins.dsurround.refmap.json

# Dependencies (CurseMaven file ids, unless a version)
orelib_file = 2820815
jei_version = 4.16.1.301
animania_base_version = 2.0.3.28
animania_farm_version = 1.0.2.28
animania_extra_version = 1.0.2.28
craftstudioapi_file = 2661859
cosmeticarmor_file = 2660068
ironchest_file = 2747935
theoneprobe_file = 2667280
biomesoplenty_file = 2715506
creativecore_file = 3467576
littletiles_file = 3483878
sereneseasons_file = 2799213
ctm_file = 2915363

# Dev runs
minecraft_username = Developer
